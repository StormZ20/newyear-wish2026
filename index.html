<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 🎆</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    width: 90%;
  }

  .content h1 {
    font-size: 3em;
    margin: 0;
    animation: glow 2s infinite alternate;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 5px #ff4d4d, 0 0 10px #ffdb4d; }
    50% { text-shadow: 0 0 20px #ff4d4d, 0 0 30px #ffdb4d; }
    100% { text-shadow: 0 0 5px #ff4d4d, 0 0 10px #ffdb4d; }
  }

  .content p {
    font-size: 1.2em;
    margin-top: 25px;
    font-style: italic;
    opacity: 0.8;
  }

  .from {
    margin-top: 20px;
  }

  @media (max-width: 600px) {
    h1 { font-size: 2em; }
    p { font-size: 1em; }
  }

  .whatsapp-btn, .music-btn {
    position: fixed;
    bottom: 20px;
    z-index: 20;
    padding: 10px 14px;
    border: none;
    border-radius: 50px;
    font-weight: bold;
    cursor: pointer;
  }

  .whatsapp-btn { background-color: #25D366; color: white; right: 20px; }
  .music-btn { background-color: #ff4d4d; color: white; right: 100px; }

  /* Start overlay */
  #startScreen {
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100;
  }

  #startBtn {
    font-size:1.8em;
    padding:25px 40px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:#ff4d4d;
    color:white;
    animation: pulse 1.2s infinite;
    box-shadow: 0 0 20px #ff4d4d;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 20px #ff4d4d; }
    50% { transform: scale(1.1); box-shadow: 0 0 40px #ff4d4d; }
    100% { transform: scale(1); box-shadow: 0 0 20px #ff4d4d; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="content">
  <h1 id="title">🎆 Happy New Year 🎆</h1>
  <p>
    May this new year bring you happiness, success, peace, and unforgettable moments ✨  
    <br><br>
    Cheers to new beginnings 🥂
  </p>
  <div class="from" id="fromText"></div>
</div>

<!-- Music + Buttons -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵 Music</button>
<button class="whatsapp-btn" onclick="shareWhatsApp()">📲 WhatsApp</button>

<!-- Start overlay for mobile auto-play -->
<div id="startScreen">
  <button id="startBtn" onclick="startCelebration()">🎇 Click to Celebrate 🎆</button>
</div>

<script>
// Canvas setup
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Particle class for fireworks
class Particle {
  constructor(x, y, color, life) {
    this.x = x; this.y = y;
    this.color = color; this.life = life;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = (Math.random() - 0.5) * 4;
  }
  update() { this.x += this.vx; this.y += this.vy; this.life -= 1; }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
    ctx.fill();
  }
}

const particles = [];
function createFirework(x=null, y=null) {
  x = x || Math.random() * canvas.width;
  y = y || Math.random() * canvas.height/2;
  const colors = ["#ff4d4d","#ffdb4d","#4dff88","#4da6ff","#ff4da6"];
  for(let i=0;i<100;i++){
    particles.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)],50));
  }
}

function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Random fireworks
  if (Math.random() < 0.05) createFirework();

  // Update particles
  particles.forEach((p,index)=>{
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(index,1);
  });

  // Floating stars
  for(let i=0;i<5;i++){
    ctx.fillStyle = `rgba(255,255,255,${Math.random()})`;
    ctx.beginPath();
    ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2, 0, Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(animate);
}
animate();

// Confetti
let confettiPieces = [];
function createConfetti() {
  for(let i=0;i<200;i++){
    confettiPieces.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      color: `hsl(${Math.random()*360},100%,50%)`,
      size: Math.random()*6+4,
      vy: Math.random()*3+2,
      vx: Math.random()*2-1
    });
  }
}

function drawConfetti() {
  confettiPieces.forEach((c,index)=>{
    c.y += c.vy;
    c.x += c.vx;
    ctx.fillStyle = c.color;
    ctx.fillRect(c.x, c.y, c.size, c.size);
    if(c.y > canvas.height) confettiPieces.splice(index,1);
  });
  requestAnimationFrame(drawConfetti);
}

// URL Parameters
const params = new URLSearchParams(window.location.search);
const to = params.get("to");
const from = params.get("from");
if (to) document.getElementById("title").innerText = `🎆 Happy New Year, ${to}! 🎆`;
if (from) document.getElementById("fromText").innerText = `— From ${from} ❤️`;

// Music setup
const music = document.getElementById("bgMusic");

// Start celebration
function startCelebration() {
  document.getElementById("startScreen").style.display = "none";
  music.play();
  createConfetti();
}

// Music toggle
function toggleMusic() {
  if(music.paused){ music.play(); } else { music.pause(); }
}

// WhatsApp button
function shareWhatsApp() {
  const toParam = params.get("to") || "you";
  const fromParam = params.get("from") || "me";
  const message = `🎆 Happy New Year, ${toParam}! 🎆\n\nMay this year bring you happiness, success and peace ✨\n\n— From ${fromParam}`;
  const waUrl = "https://wa.me/?text=" + encodeURIComponent(message);
  window.open(waUrl, "_blank");
}

// Click anywhere for extra fireworks
canvas.addEventListener("click", (e)=>{ createFirework(e.clientX,e.clientY); });

// Draw confetti continuously
drawConfetti();
</script>

</body>
</html>
